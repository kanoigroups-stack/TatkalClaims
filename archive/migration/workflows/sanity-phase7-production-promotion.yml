name: Phase 7 promote Sanity production dataset

on:
  push:
    branches:
      - cms/sanity-production-cutover
    paths:
      - scripts/promote-sanity-production.ts
      - migration/sanity/dry-run.ndjson
      - .github/workflows/sanity-phase7-production-promotion.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-phase7-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ah5vm288
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2026-08-27
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}

    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inspect Sanity datasets
        id: datasets
        shell: bash
        run: |
          set -euo pipefail
          npx sanity dataset list --project-id ah5vm288 | tee /tmp/sanity-datasets.txt
          if grep -Eq '(^|[[:space:]])production([[:space:]]|$)' /tmp/sanity-datasets.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create empty public production dataset if absent
        if: steps.datasets.outputs.exists == 'false'
        run: npx sanity dataset create production --visibility public --project-id ah5vm288

      - name: Require public production visibility
        shell: bash
        run: |
          set -euo pipefail
          npx sanity dataset visibility get production --project-id ah5vm288 | tee /tmp/production-visibility.txt
          if ! grep -qi "public" /tmp/production-visibility.txt; then
            echo "Production dataset is not public. Refusing promotion."
            exit 1
          fi

      - name: Promote frozen 57-article payload
        run: npx --yes tsx@4.19.2 scripts/promote-sanity-production.ts --confirm-production-promotion

      - name: Upload production promotion report
        uses: actions/upload-artifact@v4
        with:
          name: sanity-production-promotion
          path: migration/phase7/production-promotion-report.json
          if-no-files-found: error
