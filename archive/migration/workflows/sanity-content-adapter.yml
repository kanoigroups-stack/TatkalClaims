name: Sanity content adapter preview

on:
  push:
    branches:
      - cms/sanity-content-adapter-v2
    paths:
      - lib/content/**
      - components/blog/PortableArticleBody.tsx
      - app/cms-preview/**
      - sanity/env.ts
      - .env.example
      - package.json
      - scripts/verify-sanity-content-adapter.ts
      - .github/workflows/sanity-content-adapter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ah5vm288
      NEXT_PUBLIC_SANITY_DATASET: migration
      NEXT_PUBLIC_SANITY_API_VERSION: 2026-08-27

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify anonymous Sanity content adapter parity
        run: npx --yes tsx@4.19.2 scripts/verify-sanity-content-adapter.ts

      - name: Build Next.js application
        run: npm run build
