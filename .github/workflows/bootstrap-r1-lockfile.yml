name: Bootstrap R1 lockfile

on:
  push:
    branches:
      - chore/audit-r1-security-deterministic-builds

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile installs cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: add deterministic npm lockfile"
          git push
