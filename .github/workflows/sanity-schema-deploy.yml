name: Sanity schema deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-schema-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_SCHEMA_DEPLOY_TOKEN }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ah5vm288
      NEXT_PUBLIC_SANITY_DATASET: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for pinned Sanity CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22.12

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Check schema deploy token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SANITY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret SANITY_SCHEMA_DEPLOY_TOKEN"
            exit 1
          fi

      - name: Validate Tatkal Claims Studio schema
        run: npx --yes sanity@6.11.0 schemas validate --workspace tatkalClaims --level error

      - name: Deploy Tatkal Claims Studio schema
        run: npx --yes sanity@6.11.0 schemas deploy --workspace tatkalClaims --verbose

      - name: Verify deployed schema is stored
        shell: bash
        run: |
          set -euo pipefail
          npx --yes sanity@6.11.0 schemas list --json > schema-deploy-verification.json
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("schema-deploy-verification.json", "utf8"));
          if (!Array.isArray(data) || data.length < 1) {
            throw new Error("No deployed Sanity schemas were returned after deployment");
          }
          console.log(`Verified ${data.length} deployed schema record(s).`);
          NODE

      - name: Upload non-sensitive schema verification
        uses: actions/upload-artifact@v4
        with:
          name: sanity-schema-deploy-verification
          path: schema-deploy-verification.json
          if-no-files-found: error
          retention-days: 30
