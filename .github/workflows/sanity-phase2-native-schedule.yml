name: Schedule Phase 2 Sanity releases natively

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-phase2-native-scheduling
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_SCHEMA_DEPLOY_TOKEN }}
      SANITY_PROJECT_ID: ah5vm288
      SANITY_DATASET: production
      SANITY_API_VERSION: "2025-02-19"

    steps:
      - name: Check required Sanity token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SANITY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret SANITY_SCHEMA_DEPLOY_TOKEN"
            exit 1
          fi

      - name: Validate, schedule, and verify Phase 2 releases
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const projectId = process.env.SANITY_PROJECT_ID;
          const dataset = process.env.SANITY_DATASET;
          const apiVersion = process.env.SANITY_API_VERSION;
          const token = process.env.SANITY_AUTH_TOKEN;

          const releases = [
            {
              id: "phase-2-ped-5-year-moratorium-sep-3",
              publishAt: "2026-09-03T04:30:00.000Z",
              slug: "health-insurance-claim-rejected-pre-existing-disease",
              hero: "https://tatkalclaims.com/editorial/health-insurance-claim-rejected-pre-existing-disease.webp",
              social: "https://tatkalclaims.com/editorial/social/health-insurance-claim-rejected-pre-existing-disease.webp",
            },
            {
              id: "phase-2-insurance-ombudsman-sep-4",
              publishAt: "2026-09-04T04:30:00.000Z",
              slug: "insurance-ombudsman-complaint-process-india",
              hero: "https://tatkalclaims.com/editorial/insurance-ombudsman-complaint-process-india.webp",
              social: "https://tatkalclaims.com/editorial/social/insurance-ombudsman-complaint-process-india.webp",
            },
            {
              id: "phase-2-car-theft-claim-sep-5",
              publishAt: "2026-09-05T04:30:00.000Z",
              slug: "car-theft-insurance-claim-process-india",
              hero: "https://tatkalclaims.com/editorial/car-theft-insurance-claim-process-india.webp",
              social: "https://tatkalclaims.com/editorial/social/car-theft-insurance-claim-process-india.webp",
            },
            {
              id: "phase-2-two-health-policies-sep-6",
              publishAt: "2026-09-06T04:30:00.000Z",
              slug: "claim-two-health-insurance-policies-india",
              hero: "https://tatkalclaims.com/editorial/claim-two-health-insurance-policies-india.webp",
              social: "https://tatkalclaims.com/editorial/social/claim-two-health-insurance-policies-india.webp",
            },
            {
              id: "phase-2-life-death-claim-sep-7",
              publishAt: "2026-09-07T04:30:00.000Z",
              slug: "life-insurance-death-claim-process-india",
              hero: "https://tatkalclaims.com/editorial/life-insurance-death-claim-process-india.webp",
              social: "https://tatkalclaims.com/editorial/social/life-insurance-death-claim-process-india.webp",
            },
            {
              id: "phase-2-ctl-total-loss-sep-8",
              publishAt: "2026-09-08T04:30:00.000Z",
              slug: "car-total-loss-constructive-total-loss-idv",
              hero: "https://tatkalclaims.com/editorial/car-total-loss-constructive-total-loss-idv.webp",
              social: "https://tatkalclaims.com/editorial/social/car-total-loss-constructive-total-loss-idv.webp",
            },
          ];

          const base = `https://${projectId}.api.sanity.io/v${apiVersion}/data`;
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          };

          async function query(groq) {
            const url = `${base}/query/${dataset}?perspective=raw&query=${encodeURIComponent(groq)}`;
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Sanity query failed (${response.status}): ${body.slice(0, 500)}`);
            }
            return JSON.parse(body).result;
          }

          async function fetchRelease(releaseId) {
            const result = await query(
              `releases::all()[name == "${releaseId}"][0]{name,state,publishAt,metadata}`,
            );
            if (!result) {
              throw new Error(`Release not found: ${releaseId}`);
            }
            return result;
          }

          async function fetchReleaseDocs(releaseId) {
            return query(
              `*[sanity::partOfRelease("${releaseId}")]{_id,_type,"slug":slug.current,publishedAt,"hero":featuredImage.externalUrl,"social":socialImage.externalUrl,seo,"author":author->name}`,
            );
          }

          const actions = [];

          for (const expected of releases) {
            const release = await fetchRelease(expected.id);
            const docs = await fetchReleaseDocs(expected.id);

            if (release.metadata?.releaseType !== "scheduled") {
              throw new Error(`${expected.id}: releaseType is not scheduled`);
            }
            if (release.metadata?.intendedPublishAt !== expected.publishAt) {
              throw new Error(
                `${expected.id}: intendedPublishAt mismatch (${release.metadata?.intendedPublishAt})`,
              );
            }
            if (docs.length !== 1) {
              throw new Error(`${expected.id}: expected exactly 1 version document, found ${docs.length}`);
            }

            const doc = docs[0];
            if (doc.slug !== expected.slug) {
              throw new Error(`${expected.id}: slug mismatch (${doc.slug})`);
            }
            if (doc.publishedAt !== expected.publishAt) {
              throw new Error(`${expected.id}: article publishedAt mismatch (${doc.publishedAt})`);
            }
            if (doc.hero !== expected.hero || doc.social !== expected.social) {
              throw new Error(`${expected.id}: branded media URL mismatch`);
            }
            if (doc.seo?.noIndex !== false || doc.seo?.noFollow !== false) {
              throw new Error(`${expected.id}: SEO index/follow guard failed`);
            }
            if (doc.author !== "Claims Expert") {
              throw new Error(`${expected.id}: author guard failed (${doc.author})`);
            }

            if (release.state === "scheduled") {
              if (release.publishAt !== expected.publishAt) {
                throw new Error(
                  `${expected.id}: already scheduled at unexpected time ${release.publishAt}`,
                );
              }
              console.log(`Already scheduled correctly: ${expected.id} -> ${expected.publishAt}`);
              continue;
            }

            if (release.state !== "active") {
              throw new Error(`${expected.id}: unexpected release state ${release.state}`);
            }

            actions.push({
              actionType: "sanity.action.release.schedule",
              releaseId: expected.id,
              publishAt: expected.publishAt,
            });
          }

          if (actions.length > 0) {
            const response = await fetch(`${base}/actions/${dataset}`, {
              method: "POST",
              headers,
              body: JSON.stringify({ actions }),
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(
                `Sanity release scheduling failed (${response.status}): ${body.slice(0, 1000)}`,
              );
            }
            const result = JSON.parse(body);
            console.log(`Scheduled ${actions.length} release(s) in transaction ${result.transactionId || "unknown"}.`);
          } else {
            console.log("All six releases were already scheduled correctly; no mutation was needed.");
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 20; attempt += 1) {
            const states = await Promise.all(
              releases.map(async (expected) => ({
                expected,
                actual: await fetchRelease(expected.id),
              })),
            );

            const complete = states.every(
              ({ expected, actual }) =>
                actual.state === "scheduled" && actual.publishAt === expected.publishAt,
            );

            if (complete) {
              for (const { expected } of states) {
                console.log(`VERIFIED scheduled: ${expected.id} -> ${expected.publishAt}`);
              }
              process.exit(0);
            }

            if (attempt < 20) {
              await sleep(1500);
            }
          }

          throw new Error("Timed out waiting for all six releases to reach scheduled state with the correct publishAt.");
          NODE
