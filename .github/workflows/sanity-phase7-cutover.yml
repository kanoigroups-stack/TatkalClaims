name: Phase 7 production CMS cutover gate

on:
  push:
    branches:
      - cms/sanity-production-cutover
    paths:
      - app/blog/**
      - app/page.tsx
      - app/sitemap.ts
      - components/blog/**
      - components/sections/KnowledgeSection.tsx
      - lib/content/**
      - sanity/**
      - sanity.config.ts
      - next.config.js
      - .env.example
      - scripts/verify-phase7-production-cutover.ts
      - .github/workflows/sanity-phase7-cutover.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-phase7-cutover
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production Sanity and public cutover parity
        run: npx --yes tsx@4.19.2 scripts/verify-phase7-production-cutover.ts

      - name: Build with Sanity as the live source
        env:
          BLOG_CONTENT_SOURCE: sanity
        run: npm run build

      - name: Build rollback path with legacy source
        env:
          BLOG_CONTENT_SOURCE: legacy
        run: |
          rm -rf .next
          npm run build

      - name: Upload Phase 7 verification
        uses: actions/upload-artifact@v4
        with:
          name: phase7-production-cutover-verification
          path: migration/phase7/production-cutover-verification.json
          if-no-files-found: error
