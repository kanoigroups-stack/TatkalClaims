name: Prune verified stale branches

on:
  push:
    branches:
      - security/next15-lts-reproducible-builds
    paths:
      - .github/workflows/prune-verified-stale-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with push credentials
        uses: actions/checkout@v4

      - name: Delete ancestry-verified stale branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "chore/path-aware-ci"
            "cms/blog-baseline"
            "cms/phase7-live-verification"
            "cms/phase8-link-rendering-fix"
            "cms/phase8-preview-fetch-diagnostic"
            "cms/phase8-preview-link-diagnostic"
            "cms/phase8-preview-no-store-fix"
            "cms/phase8-recovery-system-doc-fix"
            "cms/phase8-sanity-backup"
            "cms/phase8-sanity-recovery"
            "cms/phase8-separate-project-recovery"
            "cms/phase8-stabilization"
            "cms/phase8-studio-media-polish"
            "cms/phase9b-legacy-retirement-dry-run"
            "cms/run-sanity-public-id-repair"
            "cms/sanity-article-draft-sop"
            "cms/sanity-content-adapter-v2"
            "cms/sanity-mcp-schema-deploy"
            "cms/sanity-migration-tooling"
            "cms/sanity-phase-2"
            "cms/sanity-phase-4-test-import"
            "cms/sanity-phase-4-workflow-fix"
            "cms/sanity-production-cutover"
            "cms/sanity-public-id-repair"
            "cms/sanity-staging-parity"
            "feat/header-home-call-us"
            "feat/phase15g-knowledge-centre-hierarchy"
            "fix/footer-logo-contrast"
            "fix/mobile-footer-quick-links-columns"
            "fix/phase14f-root-og-image-reference"
            "maintenance/phase13b-editorial-seo-hardening"
            "monetization/phase12-adsense-architecture"
            "monetization/phase12c-activation-prep"
            "seo/phase13f-c-health-survey-redirect"
            "seo/phase13j-b-taxonomy-ux-seo"
            "seo/phase14b-a-p0-static-metadata"
            "seo/phase14b-b-service-regulatory-corrections"
            "seo/phase14c-b-author-entity-modeling"
            "seo/phase14c-c2-author-profile-ux"
            "seo/phase14d-article-social-metadata-hardening"
            "seo/phase14d-b-technical-seo-geo"
            "seo/phase14d-internal-link-intent-separation"
            "ux/phase10-knowledge-centre-redesign"
            "ux/phase11b-article-ux-redesign"
          )
          for branch in "${branches[@]}"; do
            echo "Deleting verified merged branch: $branch"
            git push origin --delete "$branch"
          done
