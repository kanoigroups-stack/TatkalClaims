name: Application and content safety gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      safeguards: ${{ steps.classify.outputs.safeguards }}
      schema: ${{ steps.classify.outputs.schema }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify verification scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "safeguards=true" >> "$GITHUB_OUTPUT"
            echo "schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            CHANGED_FILES="$(git show --pretty="" --name-only "$HEAD_SHA")"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          printf "Changed files:\n%s\n" "$CHANGED_FILES"

          safeguards=false
          schema=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              app/blog/*|app/cms-preview/*|app/sitemap.ts|app/ads.txt/route.ts|app/globals.css|app/privacy-policy/page.tsx|app/page.tsx|components/blog/*|components/ads/*|components/floating/*|lib/content/*|lib/adsense/*|sanity/*|sanity.config.*|sanity.cli.*|.env.example|middleware.ts|next.config.js|scripts/*|docs/*|migration/*|package.json|package-lock.json|.github/workflows/application-safety-gate.yml|.github/workflows/sanity-production-backup.yml|.github/workflows/sanity-recovery-validation.yml|.github/workflows/sanity-schema-deploy.yml)
                safeguards=true
                ;;
            esac

            case "$file" in
              sanity/*|sanity.config.*|sanity.cli.*|package.json|package-lock.json|.github/workflows/application-safety-gate.yml)
                schema=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "safeguards=$safeguards" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify application
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show verification scope
        run: |
          echo "Content/runtime safeguards: ${{ needs.changes.outputs.safeguards }}"
          echo "Sanity schema validation: ${{ needs.changes.outputs.schema }}"

      - name: Verify Phase 9 Sanity-only retirement invariants
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-phase9-legacy-retirement.ts

      - name: Verify Studio Portable Text link rendering
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-portable-link-rendering.tsx

      - name: Verify deterministic preview draft selection
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-preview-draft-selection.ts

      - name: Verify Sanity backup workflow safeguards
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-sanity-backup-workflow.ts

      - name: Verify Sanity schema deploy workflow safeguards
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-sanity-schema-deploy-workflow.ts

      - name: Verify Sanity article draft SOP invariants
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-sanity-article-draft-sop.ts

      - name: Verify Phase 13 editorial and SEO hardening
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-phase13-editorial-seo-hardening.ts

      - name: Verify Phase 12 AdSense safeguards
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-phase12-adsense.ts

      - name: Verify Sanity recovery workflow safeguards
        if: needs.changes.outputs.safeguards == 'true'
        run: npx --yes tsx@4.19.2 scripts/verify-sanity-recovery-workflow.ts

      - name: Type-check application and verification code
        run: npx tsc --noEmit

      - name: Set up Node.js for latest Sanity CLI
        if: needs.changes.outputs.schema == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12

      - name: Validate Studio schema with latest Sanity CLI
        if: needs.changes.outputs.schema == 'true'
        run: npx --yes sanity@latest schemas validate --workspace tatkalClaims --level error

      - name: Restore Node.js for application build
        if: needs.changes.outputs.schema == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build application
        run: npm run build

      - name: Upload application safety verification
        if: needs.changes.outputs.safeguards == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: application-safety-verification
          path: migration/phase9/legacy-retirement-verification.json
          if-no-files-found: error
