name: Phase 6 Sanity staging parity

on:
  push:
    branches:
      - cms/sanity-staging-parity
    paths:
      - sanity/schemaTypes/documents/article.ts
      - scripts/prepare-sanity-migration.ts
      - scripts/verify-phase6-staging-parity.ts
      - lib/content/**
      - components/blog/PortableArticleBody.tsx
      - app/cms-staging/**
      - .github/workflows/sanity-phase6-staging-parity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanity-phase6-staging-parity
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ah5vm288
      NEXT_PUBLIC_SANITY_DATASET: migration
      NEXT_PUBLIC_SANITY_API_VERSION: 2026-08-27
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}

    steps:
      - name: Check out parity branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate migration payload with legacy order
        run: npx --yes tsx@4.19.2 scripts/prepare-sanity-migration.ts

      - name: Validate migration-order payload
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const docs = fs.readFileSync('migration/sanity/dry-run.ndjson','utf8')
            .trim().split(/\r?\n/).filter(Boolean).map(JSON.parse)
          const articles = docs.filter(d => d._type === 'article')
          if (docs.length !== 65) throw new Error('Expected 65 migration documents')
          if (articles.length !== 57) throw new Error('Expected 57 migration articles')
          articles.forEach((article, index) => {
            if (article.legacyOrder !== index) {
              throw new Error('legacyOrder mismatch at ' + article.slug.current)
            }
          })
          console.log(JSON.stringify({documents: docs.length, articles: articles.length, legacyOrder: '0..56'}, null, 2))
          NODE

      - name: Update Sanity migration dataset only
        run: npx --yes tsx@4.19.2 scripts/import-sanity-migration.ts --confirm-import

      - name: Re-verify exact migration dataset parity
        run: npx --yes tsx@4.19.2 scripts/verify-sanity-migration.ts

      - name: Verify Phase 6 staging, SEO and renderer parity
        run: npx --yes tsx@4.19.2 scripts/verify-phase6-staging-parity.ts

      - name: Verify reviewed table warnings and cutover blockers
        run: npx --yes tsx@4.19.2 scripts/verify-sanity-staging-parity.ts

      - name: Enforce consolidated Phase 6 gate
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('migration/sanity/staging-parity-report.json', 'utf8'))
          if (!report.parity.seoDataExact) throw new Error('SEO/data parity failed')
          if (!report.renderer.rendererCoverageExact) throw new Error('Renderer coverage failed')
          if (!report.parserReview.tableWarningReviewPassed) throw new Error('Reviewed table warning gate failed')
          if (!report.ordering.archiveOrderParity) throw new Error('Archive order parity failed')
          if (report.ordering.moreArticlesMismatchCount !== 0) throw new Error('More Articles parity failed')
          if (!report.cutover.ready) throw new Error('Phase 6 cutover gate remains blocked: ' + report.cutover.blockers.join(', '))
          console.log(JSON.stringify({cutoverReady: true, blockers: []}, null, 2))
          NODE

      - name: Build Next.js application
        run: npm run build

      - name: Upload consolidated Phase 6 reports
        uses: actions/upload-artifact@v4
        with:
          name: phase6-staging-parity
          path: |
            migration/phase6/staging-parity-report.json
            migration/sanity/staging-parity-report.json
            migration/sanity/report.json
          if-no-files-found: error

      - name: Commit deterministic Phase 6 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/sanity/dry-run.ndjson migration/sanity/report.json migration/phase6/staging-parity-report.json migration/sanity/staging-parity-report.json migration/sanity/staging-parity-report.json
          if git diff --cached --quiet; then
            echo "Phase 6 outputs are unchanged."
          else
            git commit -m "cms: record Phase 6 staging parity"
            git push origin HEAD:cms/sanity-staging-parity
          fi
